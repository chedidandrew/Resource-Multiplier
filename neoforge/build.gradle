plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

def gameTestSourceSet = sourceSets.create('gametest')
gameTestSourceSet.java {
    setSrcDirs(['../src/gametest/java', 'src/gametest/java'])
    exclude('**/SmartDropsClientGameTest.java')
    exclude('**/mixin/client/**')
    exclude('**/fixture/FabricGameTestEntityFixtures.java')
    exclude('**/fixture/FabricGameTestBlockLootFixtures.java')
    exclude('**/FabricAutomationAuthorityGameTests.java')
    exclude('**/FabricMixinAuditGameTests.java')
}
gameTestSourceSet.resources {
    setSrcDirs(['../src/gametest/resources', 'src/gametest/resources'])
    exclude('fabric.mod.json')
    exclude('smart_resource_drops_gametest.mixins.json')
}

