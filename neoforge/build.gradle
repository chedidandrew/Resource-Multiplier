plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The port intentionally consumes the canonical gameplay resources instead of
// maintaining a second copy. NeoForge-only metadata lives below this module.
sourceSets.main.resources {
    srcDir('../src/main/resources')
    exclude('fabric.mod.json')
    srcDir('src/main/resources')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

jar {
    from('../LICENSE') {
        rename { "LICENSE_${archives_base_name}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
