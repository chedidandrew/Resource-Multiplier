clientTestSourceSet.java.setSrcDirs(['src/clienttest/java'])
clientTestSourceSet.resources.setSrcDirs(['src/clienttest/resources'])

// A deliberately separate test mod. Its classes can be loaded without the
// production mod so the optional-channel matrix represents a genuinely absent
// Smart Resource Multiplier installation rather than a disabled entrypoint.
def optionalChannelTestSourceSet = sourceSets.create('optionalchanneltest')
optionalChannelTestSourceSet.java.setSrcDirs(['src/optionalchanneltest/java'])
optionalChannelTestSourceSet.resources.setSrcDirs(['src/optionalchanneltest/resources'])

// This probe compiles against Minecraft/NeoForge only. Production classes must
// be discovered exclusively from the copied final JAR in the clean mods folder.
