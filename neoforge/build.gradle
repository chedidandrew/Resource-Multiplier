plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

def gameTestSourceSet = sourceSets.create('gametest')
gameTestSourceSet.java {
    setSrcDirs(['../src/gametest/java', 'src/gametest/java'])
    exclude('**/SmartDropsClientGameTest.java')
    exclude('**/mixin/**')
    exclude('**/fixture/FabricGameTestEntityFixtures.java')
    exclude('**/fixture/FabricGameTestBlockLootFixtures.java')
}
gameTestSourceSet.resources {
    setSrcDirs(['../src/gametest/resources', 'src/gametest/resources'])
    exclude('fabric.mod.json')
    exclude('smart_resource_drops_gametest.mixins.json')
}

def clientTestSourceSet = sourceSets.create('clienttest')
clientTestSourceSet.java.setSrcDirs(['src/clienttest/java'])
clientTestSourceSet.resources.setSrcDirs(['src/clienttest/resources'])

// A deliberately separate test mod. Its classes can be loaded without the
// production mod so the optional-channel matrix represents a genuinely absent
// Smart Resource Multiplier installation rather than a disabled entrypoint.
def optionalChannelTestSourceSet = sourceSets.create('optionalchanneltest')
optionalChannelTestSourceSet.java.setSrcDirs(['src/optionalchanneltest/java'])
optionalChannelTestSourceSet.resources.setSrcDirs(['src/optionalchanneltest/resources'])

