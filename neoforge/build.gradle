legacyForge {
    enable {
        neoForgeVersion = neo_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        smartResourceDropsGameTest {
            sourceSet(sourceSets.main)
            sourceSet(gameTestSourceSet)
        }
        smartResourceDropsClientTest {
            sourceSet(sourceSets.main)
            sourceSet(clientTestSourceSet)
        }
        optionalChannelProbe {
            sourceSet(optionalChannelTestSourceSet)
        }
    }

    runs {
        client {
            client()
            loadedMods.set([legacyForge.mods.getByName(mod_id)])
        }
        server {
            server()
            loadedMods.set([legacyForge.mods.getByName(mod_id)])
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = gameTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsGameTest')])
            systemProperty 'forge.enabledGameTestNamespaces', 'smart_resource_drops_gametest'
        }
        clientCategoryTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = clientCategoryTestDirectory
            systemProperty 'smart_resource_drops.clientCategoryTest', 'true'
            systemProperty 'smart_resource_drops.clientCategoryTestDirectory',
                    clientCategoryTestDirectory.get().asFile.absolutePath
            taskBefore prepareClientCategoryTest
        }
        multiplayerServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = multiplayerServerDirectory
            systemProperty 'smart_resource_drops.multiplayerTest', 'true'
            taskBefore prepareMultiplayerServerTest
            programArgument '--nogui'
        }
        multiplayerClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = multiplayerClientDirectory
            systemProperty 'smart_resource_drops.multiplayerTest', 'true'
            taskBefore prepareMultiplayerClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25578'
        }
        optionalClientOnlyServerTest {
            server()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalClientOnlyServerDirectory
            systemProperty 'smart_resource_drops.optionalChannelTest', 'clientOnly'
            taskBefore prepareOptionalClientOnlyServerTest
            programArgument '--nogui'
        }
        optionalClientOnlyClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = optionalClientOnlyClientDirectory
            systemProperty 'smart_resource_drops.optionalClientOnlyTest', 'true'
            taskBefore prepareOptionalClientOnlyClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25580'
        }
        optionalServerOnlyServerTest {
            server()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([
                    legacyForge.mods.getByName(mod_id),
                    legacyForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalServerOnlyServerDirectory
            systemProperty 'smart_resource_drops.optionalChannelTest', 'serverOnly'
            taskBefore prepareOptionalServerOnlyServerTest
            programArgument '--nogui'
        }
        optionalServerOnlyClientTest {
            client()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalServerOnlyClientDirectory
            systemProperty 'smart_resource_drops.optionalServerOnlyClientTest', 'true'
            taskBefore prepareOptionalServerOnlyClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25581'
        }
        oversizedWireServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = oversizedWireServerDirectory
            systemProperty 'smart_resource_drops.oversizedWireTest', 'true'
            taskBefore prepareOversizedWireServerTest
            programArgument '--nogui'
        }
        oversizedWireClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = oversizedWireClientDirectory
            systemProperty 'smart_resource_drops.oversizedWireTest', 'true'
            taskBefore prepareOversizedWireClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25579'
        }
        persistenceMarkServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'mark'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            taskBefore preparePersistenceServerTest
            programArgument '--nogui'
        }
        persistenceRemoveServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'remove'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            programArgument '--nogui'
        }
        persistenceVerifyAbsentServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([legacyForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'verify_absent'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            programArgument '--nogui'
        }
    }

    addModdingDependenciesTo(gameTestSourceSet)
    addModdingDependenciesTo(clientTestSourceSet)
    addModdingDependenciesTo(optionalChannelTestSourceSet)
    addModdingDependenciesTo(sourceSets.test)

}

// Compile the canonical gameplay/config/GUI sources and replace only the thin
// Fabric integration layer with the adapters under this module.
sourceSets.main.java {
    setSrcDirs(['../src/main/java', '../src/client/java', 'src/main/java'])
    exclude('**/platform/fabric/**')
}

sourceSets.test.java.setSrcDirs(['../src/test/java', 'src/test/java'])
sourceSets.test.resources.setSrcDirs(['../src/test/resources', 'src/test/resources'])

// The port intentionally consumes the canonical gameplay resources instead of
// maintaining a second copy. NeoForge-only metadata lives below this module.
sourceSets.main.resources {
    srcDir('../src/main/resources')
    exclude('fabric.mod.json')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    gametestImplementation sourceSets.main.output
    // These are compile-only because the shared test bodies retain two Fabric-only
    // audit methods that the NeoForge registrar deliberately does not register.
    gametestCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_compile_version}"
    gametestCompileOnly "net.fabricmc.fabric-api:fabric-gametest-api-v1:${fabric_gametest_compile_version}"
    clienttestImplementation sourceSets.main.output

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.4'))
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.5.4')) {
        version {
            strictly '[0.5.4,)'
            prefer '0.5.4'
        }
    }
    // JarJar embeds MixinExtras in the production artifact, while source-set
    // userdev launches need the mod on their runtime classpaths explicitly.
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.4'
    gametestRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.4'
    clienttestRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.4'
    optionalchanneltestRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.4'

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('runGameTestServer').configure {
    doFirst {
        final File runDirectory = layout.projectDirectory.dir('run').asFile
        // Legacy GameTest reuses its world by default. A crashed run can leave item
        // entities inside later test bounds and make otherwise-correct output look
        // exactly doubled, so every evidence run must start from a fresh world.
        project.delete(
                new File(runDirectory, 'world'),
                new File(runDirectory, 'config'),
                new File(runDirectory, 'crash-reports'),
                new File(runDirectory, 'logs'))
        runDirectory.mkdirs()
    }
    doLast {
        final File logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
        if (!logFile.isFile()) {
            throw new GradleException("NeoForge GameTest log was not created: ${logFile}")
        }
        final String logText = logFile.getText('UTF-8')
        final List<String> requiredMarkers = [
                'Smart Resource Multiplier NeoForge GameTest discovery: 62 tests',
                '62 tests are now running!',
                '========= 62 GAME TESTS COMPLETE ======================',
                'All 62 required tests passed :)',
                'Game test server shutting down',
        ]
        final List<String> missingMarkers = requiredMarkers.findAll { !logText.contains(it) }
        if (!missingMarkers.isEmpty()) {
            throw new GradleException(
                    "NeoForge GameTest execution evidence is incomplete; missing ${missingMarkers}")
        }
        if (logText.contains('required tests failed :(')
                || logText.contains('Game test server crashed')
                || logText.contains('Shearing output budget exceeded for minecraft:sheep')) {
            throw new GradleException('NeoForge GameTest log reports a failure or crash')
        }
    }
}

tasks.named('runPersistenceMarkServerTest').configure {
    doLast {
        final File marker = new File(
                persistenceTestDirectory.get().asFile, 'persistence-mark.success')
        if (!marker.isFile()) {
            throw new GradleException("Persistence mark server exited without ${marker}")
        }
    }
}

tasks.named('runClientCategoryTest').configure {
    doLast {
        final File directory = clientCategoryTestDirectory.get().asFile
        final File marker = new File(directory, 'client-category.success')
        if (!marker.isFile()) {
            throw new GradleException("NeoForge category client exited without ${marker}")
        }
        final File logFile = new File(directory, 'logs/latest.log')
        if (!logFile.isFile()) {
            throw new GradleException("NeoForge category client produced no ${logFile}")
        }
        final String logText = logFile.getText('UTF-8')
        final List<String> unexpectedErrors = logText.readLines().findAll { line ->
            line.contains('/ERROR]')
                    && !line.contains('Failed to verify authentication')
                    && !line.contains('Error while loading the narrator')
                    && !line.contains('Error starting SoundSystem. Turning off sounds & music')
        }
        if (!unexpectedErrors.isEmpty()) {
            throw new GradleException(
                    "NeoForge category client log contains unexpected ERROR lines: ${unexpectedErrors}")
        }
        for (String forbidden : [
                '/FATAL]', 'Game crashed!',
                'MixinApplyError', 'InvalidInjectionException',
                'ModLoadingException', 'Failed to load mods',
                'NoClassDefFoundError', 'NoSuchMethodError', 'VerifyError']) {
            if (logText.contains(forbidden)) {
                throw new GradleException(
                        "NeoForge category client log contains forbidden failure: ${forbidden}")
            }
        }
    }
}

tasks.named('runPersistenceRemoveServerTest').configure {
    dependsOn tasks.named('runPersistenceMarkServerTest')
    doLast {
        final File marker = new File(
                persistenceTestDirectory.get().asFile, 'persistence-remove.success')
        if (!marker.isFile()) {
            throw new GradleException("Persistence remove server exited without ${marker}")
        }
    }
}

tasks.named('runPersistenceVerifyAbsentServerTest').configure {
    dependsOn tasks.named('runPersistenceRemoveServerTest')
    doLast {
        final File logFile = new File(persistenceTestDirectory.get().asFile, 'logs/latest.log')
        if (!logFile.isFile()) {
            throw new GradleException("Persistence restart gate produced no ${logFile}")
        }
        final String logText = logFile.getText('UTF-8')
        if (!logText.contains('NeoForge native placement removal persistence phase passed')) {
            throw new GradleException('Third persistence JVM did not verify the removed mark stayed absent')
        }
        for (String markerName : [
                'persistence-mark.success',
                'persistence-remove.success',
                'persistence-absent.success']) {
            final File marker = new File(persistenceTestDirectory.get().asFile, markerName)
            if (!marker.isFile()) {
                throw new GradleException("Persistence restart gate exited without ${marker}")
            }
        }
    }
}

jar {
    from('../LICENSE') {
        rename { "LICENSE_${archives_base_name}" }
    }
    manifest {
        attributes 'MixinConfigs': 'smart_resource_drops.mixins.json,smart_resource_drops.neoforge.mixins.json'
    }
}

mixin {
    add sourceSets.main, 'smart_resource_drops.refmap.json'
    config 'smart_resource_drops.mixins.json'
    config 'smart_resource_drops.neoforge.mixins.json'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
