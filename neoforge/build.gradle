def packagedClientTestDirectory = layout.buildDirectory.dir('packaged-jar-test/client')
def packagedCandidateJarProperty = providers.gradleProperty('packaged_candidate_jar')
def packagedCandidateJarName = "${archives_base_name}-${mod_version}.jar"
def resolvePackagedCandidateJar = {
    if (packagedCandidateJarProperty.isPresent()) {
        final File candidate = new File(packagedCandidateJarProperty.get())
        if (!candidate.isAbsolute()) {
            throw new GradleException('packaged_candidate_jar must be an absolute path')
        }
        if (!candidate.isFile()) {
            throw new GradleException("External packaged candidate does not exist: ${candidate}")
        }
        return candidate
    }

    final File candidate = layout.buildDirectory
            .file("libs/${packagedCandidateJarName}").get().asFile
    if (!candidate.isFile()) {
        throw new GradleException("Built packaged candidate does not exist: ${candidate}")
    }
    return candidate
}
