neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        smartResourceDropsGameTest {
            sourceSet(sourceSets.main)
            sourceSet(gameTestSourceSet)
        }
        smartResourceDropsClientTest {
            sourceSet(sourceSets.main)
            sourceSet(clientTestSourceSet)
        }
        optionalChannelProbe {
            sourceSet(optionalChannelTestSourceSet)
        }
        packagedProbe {
            sourceSet(packagedProbeSourceSet)
        }
    }

    runs {
        client {
            client()
            loadedMods.set([neoForge.mods.getByName(mod_id)])
        }
        server {
            server()
            loadedMods.set([neoForge.mods.getByName(mod_id)])
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = gameTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsGameTest')])
            systemProperty 'neoforge.enabledGameTestNamespaces', 'smart_resource_drops_gametest'
            // Minecraft 1.21.5 contributes minecraft:always_pass to the dynamic
            // test registry; select only our namespace for the exact 64-test gate.
            programArgument '--tests'
            programArgument 'smart_resource_drops_gametest:*'
        }
        clientCategoryTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = clientCategoryTestDirectory
            systemProperty 'smart_resource_drops.clientCategoryTest', 'true'
            systemProperty 'smart_resource_drops.clientCategoryTestDirectory',
                    clientCategoryTestDirectory.get().asFile.absolutePath
            taskBefore prepareClientCategoryTest
        }
        multiplayerServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = multiplayerServerDirectory
            systemProperty 'smart_resource_drops.multiplayerTest', 'true'
            taskBefore prepareMultiplayerServerTest
            programArgument '--nogui'
        }
        multiplayerClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = multiplayerClientDirectory
            systemProperty 'smart_resource_drops.multiplayerTest', 'true'
            taskBefore prepareMultiplayerClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25578'
        }
        optionalClientOnlyServerTest {
            server()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([neoForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalClientOnlyServerDirectory
            systemProperty 'smart_resource_drops.optionalChannelTest', 'clientOnly'
            taskBefore prepareOptionalClientOnlyServerTest
            programArgument '--nogui'
        }
        optionalClientOnlyClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = optionalClientOnlyClientDirectory
            systemProperty 'smart_resource_drops.optionalClientOnlyTest', 'true'
            taskBefore prepareOptionalClientOnlyClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25580'
        }
        optionalServerOnlyServerTest {
            server()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([
                    neoForge.mods.getByName(mod_id),
                    neoForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalServerOnlyServerDirectory
            systemProperty 'smart_resource_drops.optionalChannelTest', 'serverOnly'
            taskBefore prepareOptionalServerOnlyServerTest
            programArgument '--nogui'
        }
        optionalServerOnlyClientTest {
            client()
            sourceSet = optionalChannelTestSourceSet
            loadedMods.set([neoForge.mods.getByName('optionalChannelProbe')])
            gameDirectory = optionalServerOnlyClientDirectory
            systemProperty 'smart_resource_drops.optionalServerOnlyClientTest', 'true'
            taskBefore prepareOptionalServerOnlyClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25581'
        }
        oversizedWireServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = oversizedWireServerDirectory
            systemProperty 'smart_resource_drops.oversizedWireTest', 'true'
            taskBefore prepareOversizedWireServerTest
            programArgument '--nogui'
        }
        oversizedWireClientTest {
            client()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = oversizedWireClientDirectory
            systemProperty 'smart_resource_drops.oversizedWireTest', 'true'
            taskBefore prepareOversizedWireClientTest
            programArgument '--quickPlayMultiplayer'
            programArgument '127.0.0.1:25579'
        }
        persistenceMarkServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'mark'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            taskBefore preparePersistenceServerTest
            programArgument '--nogui'
        }
        persistenceRemoveServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'remove'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            programArgument '--nogui'
        }
        persistenceVerifyAbsentServerTest {
            server()
            sourceSet = clientTestSourceSet
            loadedMods.set([neoForge.mods.getByName('smartResourceDropsClientTest')])
            gameDirectory = persistenceTestDirectory
            systemProperty 'smart_resource_drops.persistenceTestPhase', 'verify_absent'
            systemProperty 'smart_resource_drops.persistenceTestDirectory',
                    persistenceTestDirectory.get().asFile.absolutePath
            programArgument '--nogui'
        }
        packagedServerTest {
            server()
            sourceSet = packagedProbeSourceSet
            loadedMods.set([neoForge.mods.getByName('packagedProbe')])
            gameDirectory = packagedServerTestDirectory
            systemProperty 'smart_resource_drops.packagedServerProbe', 'true'
            systemProperty 'smart_resource_drops.packagedTestDirectory',
                    packagedServerTestDirectory.get().asFile.absolutePath
            systemProperty 'smart_resource_drops.packagedCandidateJar',
                    new File(packagedServerTestDirectory.get().asFile,
                            "mods/${packagedCandidateJarName}").absolutePath
            taskBefore preparePackagedServerTest
            programArgument '--nogui'
        }
        packagedClientTest {
            client()
            sourceSet = packagedProbeSourceSet
            loadedMods.set([neoForge.mods.getByName('packagedProbe')])
            gameDirectory = packagedClientTestDirectory
            systemProperty 'smart_resource_drops.packagedClientProbe', 'true'
            systemProperty 'smart_resource_drops.packagedTestDirectory',
                    packagedClientTestDirectory.get().asFile.absolutePath
            systemProperty 'smart_resource_drops.packagedCandidateJar',
                    new File(packagedClientTestDirectory.get().asFile,
                            "mods/${packagedCandidateJarName}").absolutePath
            taskBefore preparePackagedClientTest
        }
    }

    addModdingDependenciesTo(gameTestSourceSet)
    addModdingDependenciesTo(clientTestSourceSet)
    addModdingDependenciesTo(optionalChannelTestSourceSet)
    addModdingDependenciesTo(packagedProbeSourceSet)

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        // Test fixtures are folded into testedMod by ModDevGradle. Loading every
        // run-only model here repeats the same main output under multiple mod keys
        // and makes the JUnit worker lose its test classes.
        loadedMods.set([mods."${mod_id}"])
    }
}

tasks.named('runPersistenceMarkServerTest') {
    doLast {
        final File marker = new File(persistenceTestDirectory.get().asFile, 'persistence-mark.success')
        if (!marker.isFile()) {
            throw new GradleException("Persistence mark server exited without success marker ${marker}")
        }
    }
}

tasks.named('runGameTestServer') {
    doFirst {
        final File logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
        if (logFile.exists() && !logFile.delete()) {
            throw new GradleException("Could not remove stale NeoForge GameTest log ${logFile}")
        }
        extensions.extraProperties.set('smartDropsGameTestStartedAt', System.currentTimeMillis())
    }
    doLast {
        final File logFile = layout.projectDirectory.file('run/logs/latest.log').asFile
        final long startedAt = extensions.extraProperties.get('smartDropsGameTestStartedAt') as long
        if (!logFile.isFile() || logFile.lastModified() < startedAt) {
            throw new GradleException("NeoForge GameTest run did not produce a fresh ${logFile}")
        }
        final String log = logFile.getText('UTF-8')
        for (String evidence : [
                'Registered exactly 64 NeoForge 1.21.5 GameTests',
                '64 tests are now running',
                '64 GAME TESTS COMPLETE',
                'All 64 required tests passed',
                'Game test server shutting down']) {
            if (!log.contains(evidence)) {
                throw new GradleException(
                        "NeoForge GameTest run is missing exact execution evidence: ${evidence}")
            }
        }
        for (String failure : ['required tests failed', 'Game crashed!', '[❌]']) {
            if (log.contains(failure)) {
                throw new GradleException(
                        "NeoForge GameTest run contains failure evidence: ${failure}")
            }
        }
    }
}

tasks.named('runClientCategoryTest') {
    doLast {
        final File marker = new File(clientCategoryTestDirectory.get().asFile, 'client-category.success')
        if (!marker.isFile()) {
            throw new GradleException("NeoForge category client exited without success marker ${marker}")
        }
        final File logFile = new File(clientCategoryTestDirectory.get().asFile, 'logs/latest.log')
        final String log = logFile.isFile() ? logFile.getText('UTF-8') : ''
        final List<String> unexpectedErrors = log.readLines().findAll { line ->
            line.contains('/ERROR]')
                    && !line.contains('Error while loading the narrator')
                    && !line.contains('Error starting SoundSystem. Turning off sounds & music')
                    && !line.contains('Failed to fetch Realms feature flags')
        }
        if (!logFile.isFile()
                || !unexpectedErrors.isEmpty()
                || log.readLines().any { line -> line.contains('/FATAL]') }
                || log.contains('Game crashed!')) {
            throw new GradleException('NeoForge category client logged an error, fatal event, or crash')
        }
    }
}

tasks.named('runPersistenceRemoveServerTest') {
    dependsOn tasks.named('runPersistenceMarkServerTest')
    doLast {
        final File marker = new File(persistenceTestDirectory.get().asFile, 'persistence-remove.success')
        if (!marker.isFile()) {
            throw new GradleException("Persistence remove server exited without success marker ${marker}")
        }
    }
}

tasks.named('runPersistenceVerifyAbsentServerTest') {
    dependsOn tasks.named('runPersistenceRemoveServerTest')
    doLast {
        for (String markerName : [
                'persistence-mark.success',
                'persistence-remove.success',
                'persistence-absent.success']) {
            final File marker = new File(persistenceTestDirectory.get().asFile, markerName)
            if (!marker.isFile()) {
                throw new GradleException("Persistence restart gate exited without success marker ${marker}")
            }
        }
    }
}

tasks.named('runPackagedServerTest') {
    doLast {
        final File marker = new File(packagedServerTestDirectory.get().asFile, 'packaged-server.success')
        if (!marker.isFile()) {
            throw new GradleException("Packaged server exited without success marker ${marker}")
        }
        final File logFile = new File(packagedServerTestDirectory.get().asFile, 'logs/latest.log')
        if (!logFile.isFile()) {
            throw new GradleException("Packaged server did not produce ${logFile}")
        }
        final String log = logFile.getText('UTF-8')
        for (String evidence : [
                'Done (',
                'Smart Resource Multiplier 1.3.2+mc1.21.5',
                'Packaged NeoForge server candidate Smart Resource Multiplier 1.3.2+mc1.21.5 passed exact version, code-source, config, status, and validation checks']) {
            if (!log.contains(evidence)) {
                throw new GradleException("Packaged server log is missing: ${evidence}")
            }
        }
        if (log.readLines().any { line -> line.contains('/ERROR]') }) {
            throw new GradleException('Packaged production server logged an ERROR')
        }
    }
}

tasks.named('runPackagedClientTest') {
    doLast {
        final File marker = new File(packagedClientTestDirectory.get().asFile, 'packaged-client.success')
        if (!marker.isFile()) {
            throw new GradleException("Packaged client exited without success marker ${marker}")
        }
        final File logFile = new File(packagedClientTestDirectory.get().asFile, 'logs/latest.log')
        final String log = logFile.isFile() ? logFile.getText('UTF-8') : ''
        final List<String> unexpectedErrors = log.readLines().findAll { line ->
            line.contains('/ERROR]')
                    && !line.contains('Error while loading the narrator')
                    && !line.contains('Error starting SoundSystem. Turning off sounds & music')
                    && !line.contains('Failed to fetch Realms feature flags')
        }
        if (!logFile.isFile()
                || !unexpectedErrors.isEmpty()
                || log.readLines().any { line -> line.contains('/FATAL]') }
                || log.contains('Game crashed!')) {
            throw new GradleException('Packaged production client logged an error, fatal event, or crash')
        }
    }
}

// Compile the canonical gameplay/config/GUI sources and replace only the thin
// Fabric integration layer with the adapters under this module.
sourceSets.main.java {
    setSrcDirs(['../src/main/java', '../src/client/java', 'src/main/java'])
    exclude('**/platform/fabric/**')
}

sourceSets.test.java.setSrcDirs(['../src/test/java', 'src/test/java'])
sourceSets.test.resources.setSrcDirs(['../src/test/resources', 'src/test/resources'])

// The port intentionally consumes the canonical gameplay resources instead of
// maintaining a second copy. NeoForge-only metadata lives below this module.
sourceSets.main.resources {
    srcDir('../src/main/resources')
    exclude('fabric.mod.json')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    gametestImplementation sourceSets.main.output
    clienttestImplementation sourceSets.main.output

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

jar {
    from('../LICENSE') {
        rename { "LICENSE_${archives_base_name}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
