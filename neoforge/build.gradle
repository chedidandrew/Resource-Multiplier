def preparePackagedServerTest = tasks.register('preparePackagedServerTest') {
    if (!packagedCandidateJarProperty.isPresent()) {
        dependsOn tasks.named('jar')
    }
    outputs.upToDateWhen { false }
    doLast {
        final File directory = packagedServerTestDirectory.get().asFile
        project.delete(directory)
        final File modsDirectory = new File(directory, 'mods')
        modsDirectory.mkdirs()
        final File sourceJar = resolvePackagedCandidateJar()
        final File copiedJar = new File(modsDirectory, packagedCandidateJarName)
        java.nio.file.Files.copy(sourceJar.toPath(), copiedJar.toPath())
        if (java.nio.file.Files.mismatch(sourceJar.toPath(), copiedJar.toPath()) != -1L) {
            throw new GradleException('Packaged server candidate copy is not byte-identical')
        }
        new File(directory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(directory, 'server.properties').setText('''\
online-mode=false
server-port=0
level-name=packaged-server-world
gamemode=creative
difficulty=peaceful
spawn-protection=0
view-distance=2
simulation-distance=2
motd=Smart Resource Multiplier packaged JAR server test
''', 'UTF-8')
    }
}
