plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = 'com.chedidandrew'
version = '1.3.2+mc1.7.10'

base {
    archivesName = 'smart-resource-multiplier-forge-mc1.7.10'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
    withSourcesJar()
}

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'
}

sourceSets {
    main {
        java.setSrcDirs(['src/legacy/java'])
        resources.setSrcDirs(['src/legacy/resources'])
    }
    test {
        java.setSrcDirs(['src/legacyTest/java'])
        resources.setSrcDirs(['src/legacyTest/resources'])
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    from('LICENSE')
}

tasks.named('test') {
    useJUnit()
}
