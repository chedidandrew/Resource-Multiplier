name: Publish Smart Resource Multiplier 1.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.2.2.yml

permissions:
  contents: write

concurrency:
  group: publish-smart-resource-multiplier-1.2.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: dc2b1d211acd64ddbdfe333049dbc7362837474a
      RELEASE_TAG: v1.2.2
    steps:
      - name: Check whether the release already exists
        id: gate
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists; publication is a no-op."
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the verified release commit
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dc2b1d211acd64ddbdfe333049dbc7362837474a
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity and authorization
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = '1.2.2'
          test "$(sed -n 's/^release_ready=//p' gradle.properties)" = 'true'
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main

      - name: Set up Java 25
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        if: steps.gate.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate package metadata and policy logic
        if: steps.gate.outputs.publish == 'true'
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh

      - name: Run Java and dedicated-server tests, then build
        if: steps.gate.outputs.publish == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        if: steps.gate.outputs.publish == 'true'
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Create deterministic release bundle
        if: steps.gate.outputs.publish == 'true'
        run: python3 tools/package_release.py --output-dir dist

      - name: Publish GitHub release and tag
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title 'Smart Resource Multiplier 1.2.2' \
            --notes-file docs/releases/1.2.2.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
