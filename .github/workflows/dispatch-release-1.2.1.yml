name: Dispatch Resource Multiplier 1.2.1 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-1.2.1.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'chedidandrew/Resource-Multiplier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch guarded release workflow on v1.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.2.1
