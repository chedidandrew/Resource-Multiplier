name: Apply approved Smart logo final

on:
  push:
    branches:
      - branding/smart-logo-final
    paths:
      - .github/workflows/apply-smart-logo-final.yml

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branding branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply approved logo and documentation updates
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .branding-staging/icon.b64.part00 \
            .branding-staging/icon.b64.part01 \
            .branding-staging/icon.b64.part02 \
            .branding-staging/icon.b64.part03 \
            .branding-staging/icon.b64.part04a \
            .branding-staging/icon.b64.part04b \
            .branding-staging/icon.b64.part04c \
            .branding-staging/icon.b64.part05 \
            .branding-staging/icon.b64.part06 \
            | tr -d '\n' | base64 --decode > src/main/resources/assets/smart_resource_drops/icon.png
          sha256sum -c .branding-staging/icon.sha256

          cat > docs/BRANDING.md <<'EOF'
          # Smart Resource Multiplier branding

          ## Current production icon

          The current `main` branch uses the approved **SMART x2** icon selected on 2026-08-31. The artwork keeps the established resource-multiplier identity while replacing the previous `RESOURCE MULTIPLIER` wordmark with `SMART` and adding restrained shader-style lighting, depth, highlights, and glow.

          The production asset remains a compact `128x128` PNG because that is the project contract enforced by package validation and is sufficient for Minecraft, Mod Menu, GitHub README rendering, and storefront thumbnails.

          - Path: `src/main/resources/assets/smart_resource_drops/icon.png`
          - Dimensions: `128x128`
          - SHA-256: `a62a59890d670c4df1ebca6375387bd47736e510cc1a755abd3ecb8bd4d24642`
          - Core visual elements: `SMART`, white `x2`, two upward green arrows, diamond, coal, iron ingot, log, grass-and-dirt frame, shader-style highlights

          The approved high-resolution artwork was downscaled to the required production size with high-quality resampling and light edge sharpening so the shader detail survives thumbnail rendering without materially increasing the packaged mod size.

          ## Release-history boundary

          GitHub Release `v1.2.2` was published before this visual refresh and remains historical release evidence. Its packaged icon is the earlier pre-refresh artwork with SHA-256 `b8a56ed24db3a2e812271d69fd021a5756469ac0d649ebd7cc3f205d7d276694`.

          This post-release change updates current `main` branding only. It does not change gameplay, the `smart_resource_drops` mod ID, configuration paths or schema, commands, datapack/network namespace, saved-world provenance, permissions, or anti-duplication behavior. Any future binary published from current `main` should use a version later than `1.2.2` rather than replacing the already published `v1.2.2` artifact.
          EOF

          python3 - <<'PY'
          from pathlib import Path

          NEW = 'a62a59890d670c4df1ebca6375387bd47736e510cc1a755abd3ecb8bd4d24642'
          OLD = 'b8a56ed24db3a2e812271d69fd021a5756469ac0d649ebd7cc3f205d7d276694'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tools/validate_package.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(f'EXPECTED_ICON_SHA256 = "{OLD}"', f'EXPECTED_ICON_SHA256 = "{NEW}"', 1)
          text = text.replace(
              'fail("The 1.2.2 rebrand must preserve the reviewed production icon byte-for-byte")',
              'fail("The current Smart Resource Multiplier production icon must match the approved reviewed artwork")',
              1,
          )
          marker = '    "docs/REBRAND.md",\n'
          if '    "docs/BRANDING.md",\n' not in text:
              if marker not in text:
                  raise SystemExit('validator docs marker not found')
              text = text.replace(marker, marker + '    "docs/BRANDING.md",\n', 1)
          p.write_text(text, encoding='utf-8')

          replace_once(
              'BUILD_STATUS.md',
              '- Icon: unchanged pending separate visual review',
              f'- Current main icon: approved **SMART x2** shader-style artwork, `128x128` PNG, SHA-256 `{NEW}`\n- Published `v1.2.2` JAR icon: historical pre-refresh artwork, SHA-256 `{OLD}`',
          )
          replace_once(
              'docs/ROADMAP.md',
              'The `smart_resource_drops` mod ID and datapack/network namespace, `config/smart_resource_drops.json`, saved placement provenance, Java package, `/smartdrops`, and `/smartdropsgui` remain stable. The icon remains unchanged pending separate visual review. Future feature work remains governed by the historical scope and safety decisions below.',
              'The `smart_resource_drops` mod ID and datapack/network namespace, `config/smart_resource_drops.json`, saved placement provenance, Java package, `/smartdrops`, and `/smartdropsgui` remain stable. The separate icon review is complete: current `main` now uses the approved **SMART x2** shader-style icon documented in [BRANDING.md](BRANDING.md), while the tagged `v1.2.2` release retains its historical pre-refresh icon. Future feature work remains governed by the historical scope and safety decisions below.',
          )
          replace_once(
              'docs/PUBLIC_RELEASE_CHECKLIST.md',
              '- [x] The production icon remains byte-for-byte unchanged for separate review.',
              '- [x] The production icon remained byte-for-byte unchanged for the published `v1.2.2` release; current post-release `main` now uses the separately approved Smart logo documented in [`BRANDING.md`](BRANDING.md).',
          )
          replace_once(
              'README.md',
              '- [Rebrand and upgrade compatibility](docs/REBRAND.md) — preserved identifiers, JAR-name transition, and upgrade steps.\n',
              '- [Rebrand and upgrade compatibility](docs/REBRAND.md) — preserved identifiers, JAR-name transition, and upgrade steps.\n- [Branding](docs/BRANDING.md) - current production icon identity, checksum, and release-history boundary.\n',
          )

          changelog = Path('CHANGELOG.md')
          ctext = changelog.read_text(encoding='utf-8')
          marker = 'All notable changes are documented here.\n\n'
          block = (
              '## Unreleased\n\n'
              '### Changed\n\n'
              '- Replaced the current `main` production icon with the approved **SMART x2** shader-style artwork while retaining the established grass/dirt frame, multiplier arrows, and resource symbols.\n'
              '- Kept the production asset at the validated `128x128` size and updated package validation to lock its SHA-256.\n'
              '- Preserved the already published `v1.2.2` release and its original icon as historical release evidence; this visual refresh changes current source branding only and no gameplay or compatibility identifier.\n\n'
          )
          if block not in ctext:
              if marker not in ctext:
                  raise SystemExit('CHANGELOG marker not found')
              changelog.write_text(ctext.replace(marker, marker + block, 1), encoding='utf-8')

          impl = Path('docs/IMPLEMENTATION_LOG.md')
          itext = impl.read_text(encoding='utf-8')
          marker = '# Implementation log\n\n'
          block = (
              '## 2026-08-31, approved SMART x2 icon refresh\n\n'
              f'The separately reviewed production artwork is now the **SMART x2** shader-style icon. The source asset remains `128x128`, with SHA-256 `{NEW}`, and continues to use the existing `assets/smart_resource_drops/icon.png` path so Fabric metadata and Mod Menu integration require no identifier or path migration. The visual keeps the grass-and-dirt frame, multiplier arrows, diamond, coal, iron ingot, and log, while replacing the previous wordmark with `SMART` and adding restrained shader-style light, depth, highlights, and glow.\n\n'
              f'The already published `v1.2.2` binary remains unchanged and retains its historical icon SHA-256 `{OLD}`. This post-release source update changes no gameplay, configuration, schema, defaults, networking, commands, permissions, persistence, datapack namespace, mod ID, or anti-duplication behavior. Package validation now locks the newly approved current-main icon checksum, and the complete automated build, dedicated-server, client, and packaging chain is rerun before promotion to `main`.\n\n'
          )
          if block not in itext:
              if marker not in itext:
                  raise SystemExit('implementation log marker not found')
              impl.write_text(itext.replace(marker, marker + block, 1), encoding='utf-8')
          PY

          rm -rf .branding-staging
          rm -f .github/workflows/apply-smart-logo-final.yml
          rm -f .github/workflows/diagnose-logo-transfer.yml
          rm -f .github/workflows/diagnose-logo-transfer-2.yml

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p = Path('src/main/resources/assets/smart_resource_drops/icon.png')
          data = p.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('icon is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (128, 128):
              raise SystemExit(f'unexpected icon size: {width}x{height}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != 'a62a59890d670c4df1ebca6375387bd47736e510cc1a755abd3ecb8bd4d24642':
              raise SystemExit(f'unexpected icon SHA-256: {digest}')
          if len(data) != 40624:
              raise SystemExit(f'unexpected icon size in bytes: {len(data)}')
          print(f'icon verified: {width}x{height}, sha256={digest}, bytes={len(data)}')
          PY

          git add -A
          git diff --cached --check

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate package metadata and policy logic
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh

      - name: Run Java and dedicated-server tests, then build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Verify built JAR contains approved logo
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/smart-resource-multiplier-1.2.2.jar
          test -f "$JAR"
          unzip -p "$JAR" assets/smart_resource_drops/icon.png > /tmp/jar-icon.png
          echo 'a62a59890d670c4df1ebca6375387bd47736e510cc1a755abd3ecb8bd4d24642  /tmp/jar-icon.png' | sha256sum -c -

      - name: Commit verified logo refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Smart Resource Multiplier logo'
          git push origin HEAD:branding/smart-logo-final
