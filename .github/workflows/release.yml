name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The lane serially verifies Fabric plus two NeoForge build profiles.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release authorization and provenance
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] || {
            echo "Release publishing requires a tag ref; found $GITHUB_REF." >&2
            exit 1
          }
          test "$GITHUB_REF" = 'refs/tags/v1.3.2+mc1.21.6-1.21.8' || {
            echo "This workflow may publish only refs/tags/v1.3.2+mc1.21.6-1.21.8; found $GITHUB_REF." >&2
            exit 1
          }

          release_ready="$(sed -n 's/^release_ready=//p' gradle.properties)"
          test "$release_ready" = "true" || {
            echo "Release publishing is locked: set release_ready=true only in the fully tested release commit." >&2
            exit 1
          }

          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify 'refs/remotes/origin/backport/1.21.6-1.21.8^{commit}' >/dev/null || {
            echo "origin/backport/1.21.6-1.21.8 is unavailable; refusing to publish." >&2
            exit 1
          }
          branch_commit="$(git rev-parse 'refs/remotes/origin/backport/1.21.6-1.21.8^{commit}')"
          test "$tag_commit" = "$branch_commit" || {
            echo "Tagged commit $tag_commit is not the tested origin/backport/1.21.6-1.21.8 tip $branch_commit; refusing to publish." >&2
            exit 1
          }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify release versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          fabric_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          default_neoforge_version="$(sed -n 's/^mod_version=//p' neoforge/gradle.properties)"
          test "$tag_version" = "$fabric_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Fabric mod_version=$fabric_version" >&2
            exit 1
          }
          test "$default_neoforge_version" = '1.3.2+mc1.21.7-1.21.8' || {
            echo "Unexpected default NeoForge version $default_neoforge_version" >&2
            exit 1
          }

      - name: Validate, test, and build Fabric 1.21.6-1.21.8
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build
          xvfb-run -a ./gradlew --no-daemon runClientSmoke
          ./gradlew --no-daemon runPersistenceVerifyAbsentServerSmoke
          bash tools/run_fabric_multiplayer_smoke.sh
          mkdir -p build/release-inputs
          install -m 0644 \
            build/libs/smart-resource-multiplier-1.3.2+mc1.21.6-1.21.8.jar \
            build/release-inputs/smart-resource-multiplier-1.3.2+mc1.21.6-1.21.8.jar

      - name: Validate, test, and build NeoForge 1.21.7-1.21.8
        run: |
          ./gradlew -p neoforge --no-daemon clean test build runGameTestServer
          python3 tools/validate_neoforge_jar.py
          ./gradlew -p neoforge --no-daemon runPersistenceVerifyAbsentServerTest
          xvfb-run -a ./gradlew -p neoforge --no-daemon runClientCategoryTest
          ./gradlew -p neoforge --no-daemon runPackagedServerTest
          xvfb-run -a ./gradlew -p neoforge --no-daemon runPackagedClientTest
          bash tools/run_neoforge_multiplayer_smoke.sh
          bash tools/run_neoforge_optional_channel_smoke.sh
          bash tools/run_neoforge_oversized_wire_smoke.sh
          install -m 0644 \
            neoforge/build/libs/smart-resource-multiplier-neoforge-1.3.2+mc1.21.7-1.21.8.jar \
            build/release-inputs/smart-resource-multiplier-neoforge-1.3.2+mc1.21.7-1.21.8.jar

      - name: Validate, test, and build NeoForge 1.21.6
        shell: bash
        run: |
          neo_args=(
            '-Pminecraft_version=1.21.6'
            '-Pminecraft_version_range=[1.21.6]'
            '-Pneo_version=21.6.20-beta'
            '-Pneo_version_range=[21.6,21.7)'
            '-Pmod_version=1.3.2+mc1.21.6'
          )
          ./gradlew -p neoforge --no-daemon "${neo_args[@]}" clean test build runGameTestServer
          python3 tools/validate_neoforge_jar.py \
            --jar neoforge/build/libs/smart-resource-multiplier-neoforge-1.3.2+mc1.21.6.jar \
            --expected-version '1.3.2+mc1.21.6' \
            --minecraft-version-range '[1.21.6]' \
            --neo-version-range '[21.6,21.7)' \
            --java-version 21
          xvfb-run -a ./gradlew -p neoforge --no-daemon "${neo_args[@]}" runClientCategoryTest
          ./gradlew -p neoforge --no-daemon "${neo_args[@]}" runPackagedServerTest
          xvfb-run -a ./gradlew -p neoforge --no-daemon "${neo_args[@]}" runPackagedClientTest
          install -m 0644 \
            neoforge/build/libs/smart-resource-multiplier-neoforge-1.3.2+mc1.21.6.jar \
            build/release-inputs/smart-resource-multiplier-neoforge-1.3.2+mc1.21.6.jar

      - name: Create and validate the three-file release set
        run: python3 tools/package_release.py --artifact-input-dir build/release-inputs --output-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Smart Resource Multiplier 1.3.2 — Minecraft 1.21.6-1.21.8
          body_path: docs/releases/1.3.2+mc1.21.6-1.21.8.md
          files: |
            dist/smart-resource-multiplier-1.3.2+mc1.21.6-1.21.8.jar
            dist/smart-resource-multiplier-neoforge-1.3.2+mc1.21.6.jar
            dist/smart-resource-multiplier-neoforge-1.3.2+mc1.21.7-1.21.8.jar
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
