name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release authorization and provenance
        shell: bash
        run: |
          release_ready="$(sed -n 's/^release_ready=//p' gradle.properties)"
          test "$release_ready" = "true" || {
            echo "Release publishing is locked: set release_ready=true only in the fully tested release commit." >&2
            exit 1
          }

          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify 'refs/remotes/origin/main^{commit}' >/dev/null || {
            echo "origin/main is unavailable; refusing to publish." >&2
            exit 1
          }
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "Tagged commit $tag_commit is not on origin/main; refusing to publish." >&2
            exit 1
          }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify tag matches mod version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$tag_version" = "$mod_version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$mod_version" >&2
            exit 1
          }

      - name: Validate, test, and build release JAR
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Create deterministic release bundle
        run: python3 tools/package_release.py --output-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          generate_release_notes: true
