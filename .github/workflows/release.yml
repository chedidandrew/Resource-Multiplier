name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches mod version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$tag_version" = "$mod_version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$mod_version" >&2
            exit 1
          }

      - name: Validate, test, and build release JAR
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Create deterministic release bundle
        run: python3 tools/package_release.py --output-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
