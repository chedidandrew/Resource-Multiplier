name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The serialized release verifies two loaders plus several real client/server
    # pairs; retain every gate while allowing a cold NeoForm cache to initialize.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release authorization and provenance
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] || {
            echo "Release publishing requires a tag ref; found $GITHUB_REF." >&2
            exit 1
          }
          test "$GITHUB_REF" = 'refs/tags/v1.3.1+mc1.21.1' || {
            echo "This workflow may publish only refs/tags/v1.3.1+mc1.21.1; found $GITHUB_REF." >&2
            exit 1
          }

          release_ready="$(sed -n 's/^release_ready=//p' gradle.properties)"
          test "$release_ready" = "true" || {
            echo "Release publishing is locked: set release_ready=true only in the fully tested release commit." >&2
            exit 1
          }

          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify 'refs/remotes/origin/backport/1.21.1^{commit}' >/dev/null || {
            echo "origin/backport/1.21.1 is unavailable; refusing to publish." >&2
            exit 1
          }
          branch_commit="$(git rev-parse 'refs/remotes/origin/backport/1.21.1^{commit}')"
          test "$tag_commit" = "$branch_commit" || {
            echo "Tagged commit $tag_commit is not the tested origin/backport/1.21.1 tip $branch_commit; refusing to publish." >&2
            exit 1
          }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify tag matches mod version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          neoforge_mod_version="$(sed -n 's/^mod_version=//p' neoforge/gradle.properties)"
          test "$tag_version" = "$mod_version" || {
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$mod_version" >&2
            exit 1
          }
          test "$neoforge_mod_version" = "$mod_version" || {
            echo "NeoForge mod_version=$neoforge_mod_version does not match Fabric mod_version=$mod_version" >&2
            exit 1
          }

      - name: Validate, test, and build Fabric release JAR
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientSmoke

      - name: Verify Fabric native placement persistence across restarts
        run: ./gradlew --no-daemon runPersistenceVerifyAbsentServerSmoke

      - name: Run Fabric multiplayer authority parity gate
        timeout-minutes: 15
        run: bash tools/run_fabric_multiplayer_smoke.sh

      - name: Validate, test, and build NeoForge release JAR
        run: |
          ./gradlew -p neoforge --no-daemon clean build runGameTestServer
          python3 tools/validate_neoforge_jar.py

      - name: Verify NeoForge native placement persistence across restarts
        run: ./gradlew -p neoforge --no-daemon runPersistenceVerifyAbsentServerTest

      - name: Run NeoForge physical-client category gate
        run: xvfb-run -a ./gradlew -p neoforge --no-daemon runClientCategoryTest

      - name: Run clean packaged-JAR-only NeoForge server and client gates
        run: |
          ./gradlew -p neoforge --no-daemon runPackagedServerTest
          xvfb-run -a ./gradlew -p neoforge --no-daemon runPackagedClientTest

      - name: Run NeoForge multiplayer parity gate
        timeout-minutes: 15
        run: bash tools/run_neoforge_multiplayer_smoke.sh

      - name: Run NeoForge optional-channel installation matrix
        timeout-minutes: 15
        run: bash tools/run_neoforge_optional_channel_smoke.sh

      - name: Run NeoForge malicious oversized-wire gate
        timeout-minutes: 12
        run: bash tools/run_neoforge_oversized_wire_smoke.sh

      - name: Create deterministic dual-loader release bundle
        run: python3 tools/package_release.py --output-dir dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Smart Resource Multiplier 1.3.1 — Minecraft 1.21.1 (Fabric + NeoForge)
          body_path: docs/releases/1.3.1+mc1.21.1.md
          files: |
            dist/smart-resource-multiplier-1.3.1+mc1.21.1.jar
            dist/smart-resource-multiplier-neoforge-1.3.1+mc1.21.1.jar
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
