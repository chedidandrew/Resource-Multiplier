name: Build and verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate package metadata and policy logic
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh

      - name: Run Java and dedicated-server tests, then build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Create source snapshot
        run: git archive --format=zip --output=build/source-snapshot.zip HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/source-snapshot.zip
          if-no-files-found: error

  neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and run NeoForge gameplay tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p neoforge --no-daemon clean build runGameTestServer

      - name: Validate NeoForge playable JAR
        run: python3 tools/validate_neoforge_jar.py

      - name: Run NeoForge Fabric migration restart gate
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p neoforge/build/migration-server-smoke-logs
          ./gradlew -p neoforge --no-daemon --console=plain runMigrationRestartServerTest \
            2>&1 | tee neoforge/build/migration-server-smoke-logs/gradle-console.log

      - name: Upload NeoForge migration restart logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-NeoForge-migration-logs-${{ github.sha }}
          path: |
            neoforge/build/migration-server-smoke-logs/
            neoforge/build/migration-server-test/logs/
            neoforge/build/migration-server-test/crash-reports/
            neoforge/build/migration-server-test/hs_err_pid*.log
            neoforge/build/migration-server-test/replay_pid*.log
            neoforge/build/migration-server-test/migration-import.success
            neoforge/build/migration-server-test/migration-restart.success
          if-no-files-found: warn
          retention-days: 7

      - name: Run NeoForge client category smoke test
        run: xvfb-run -a ./gradlew -p neoforge --no-daemon runClientCategoryTest

      - name: Run NeoForge multiplayer authority smoke test
        timeout-minutes: 12
        run: bash tools/run_neoforge_multiplayer_smoke.sh

      - name: Upload NeoForge multiplayer smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-NeoForge-multiplayer-logs-${{ github.sha }}
          path: |
            neoforge/build/multiplayer-smoke-logs/
            neoforge/build/multiplayer-test/server/logs/
            neoforge/build/multiplayer-test/server/crash-reports/
            neoforge/build/multiplayer-test/client/logs/
            neoforge/build/multiplayer-test/client/crash-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Run NeoForge optional-channel installation matrix
        timeout-minutes: 15
        run: bash tools/run_neoforge_optional_channel_smoke.sh

      - name: Upload NeoForge optional-channel smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-NeoForge-optional-channel-logs-${{ github.sha }}
          path: |
            neoforge/build/optional-channel-smoke-logs/
            neoforge/build/optional-channel-test/client-only/server/logs/
            neoforge/build/optional-channel-test/client-only/server/crash-reports/
            neoforge/build/optional-channel-test/client-only/client/logs/
            neoforge/build/optional-channel-test/client-only/client/crash-reports/
            neoforge/build/optional-channel-test/server-only/server/logs/
            neoforge/build/optional-channel-test/server-only/server/crash-reports/
            neoforge/build/optional-channel-test/server-only/client/logs/
            neoforge/build/optional-channel-test/server-only/client/crash-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Run NeoForge malicious oversized-wire smoke test
        timeout-minutes: 12
        run: bash tools/run_neoforge_oversized_wire_smoke.sh

      - name: Upload NeoForge oversized-wire smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-NeoForge-oversized-wire-logs-${{ github.sha }}
          path: |
            neoforge/build/oversized-wire-smoke-logs/
            neoforge/build/oversized-wire-test/server/logs/
            neoforge/build/oversized-wire-test/server/crash-reports/
            neoforge/build/oversized-wire-test/client/logs/
            neoforge/build/oversized-wire-test/client/crash-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload NeoForge playable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartResourceMultiplier-NeoForge-${{ github.sha }}
          path: |
            neoforge/build/libs/smart-resource-multiplier-neoforge-*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
