name: Finalize Resource Multiplier 1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-1.2.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.repository == 'chedidandrew/Resource-Multiplier'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify expected release-candidate source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "ddc2ffcc0cfcc06f63895e11086bc87f4d766e74" || {
            echo "Unexpected starting parent commit; refusing automatic promotion." >&2
            exit 1
          }
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/finalize-1.2.0.yml" || {
            echo "The workflow repair commit contains unexpected changes." >&2
            exit 1
          }
          grep -Fxq 'mod_version=1.2.0-rc.1' gradle.properties
          grep -Fxq 'release_ready=false' gradle.properties
          test -z "$(git tag -l v1.2.0)"

      - name: Promote metadata and current documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')

          def exact(path, old, new):
              file = root / path
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          archive = root / 'docs/archive'
          archive.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'BUILD_STATUS.md', archive / 'BUILD_STATUS-1.2.0-rc.1.md')
          shutil.copyfile(root / 'docs/PUBLIC_RELEASE_CHECKLIST.md', archive / 'PUBLIC_RELEASE_CHECKLIST-1.2.0-rc.1.md')

          exact('gradle.properties', 'mod_version=1.2.0-rc.1', 'mod_version=1.2.0')
          exact('gradle.properties', 'release_ready=false', 'release_ready=true')

          path = root / 'README.md'
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<img alt="Pre-release 1.2.0-rc.1" src="https://img.shields.io/badge/Status-1.2.0--rc.1-orange">': '<img alt="Stable release 1.2.0" src="https://img.shields.io/badge/Status-1.2.0-Release-2EA44F">',
              '> [!IMPORTANT]\n> **Development status:** `main` currently contains Resource Multiplier `1.2.0-rc.1`. Automated builds and tests pass, but the remaining manual gameplay, multiplayer, datapack-reload, and third-party compatibility checks must be completed before the final 1.2.0 release. There is no stable public download yet.': '> [!IMPORTANT]\n> **Current stable release:** Resource Multiplier `1.2.0` for Minecraft Java Edition 26.2 and Fabric. Automated checks and the maintainer-performed manual release matrix passed. Third-party compatibility remains case-specific and should be reported with exact project versions.',
              'These are real client GameTest captures from the `1.2.0-rc.1` codebase. Automated screenshots verify that the screens open; hands-on appearance and navigation checks remain part of the manual release gate.': 'These are real client captures from the validated Resource Multiplier `1.2.0` release line.',
              'Resource Multiplier 1.2.0 is not publicly released yet.\n\nThe current `main` branch is version `1.2.0-rc.1`. Test artifacts are produced by [GitHub Actions](https://github.com/chedidandrew/Resource-Multiplier/actions) after successful builds, but they are not presented as stable releases. The first public release will appear on [GitHub Releases](https://github.com/chedidandrew/Resource-Multiplier/releases) only after the remaining manual checks are completed.': 'Official Resource Multiplier builds are published through [GitHub Releases](https://github.com/chedidandrew/Resource-Multiplier/releases). Use the file matching your Minecraft version and mod loader.\n\nThe stable Fabric 26.2 artifact is `resource-multiplier-1.2.0.jar`.',
              '| Java | 25 or newer |': '| Java | 25, required by Minecraft 26.2 |',
              'The expected development artifact is `build/libs/resource-multiplier-1.2.0-rc.1.jar`.': 'The expected artifact is `build/libs/resource-multiplier-1.2.0.jar`.',
              'No GitHub Release, Modrinth page, CurseForge page, or project homepage is claimed by this release candidate.': 'Official releases are published through GitHub Releases. CurseForge availability depends on project approval and file publication.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README.md: missing expected text {old!r}')
              text = text.replace(old, new, 1)
          if '1.2.0-rc.1' in text:
              raise SystemExit('README.md still contains release-candidate version text')
          path.write_text(text, encoding='utf-8')

          path = root / 'CHANGELOG.md'
          text = path.read_text(encoding='utf-8')
          text = text.replace('## 1.2.0-rc.1 - Unreleased', '## 1.2.0 - 2026-08-30', 1)
          text = text.replace(
              '- Marked the current development build as `1.2.0-rc.1` while keeping the publication latch at `release_ready=false`. This identifies the tested artifact honestly as a release candidate; no Git tag, GitHub Release, or other publication is part of this pass.',
              '- Promoted the fully tested release candidate to stable `1.2.0` and enabled the guarded publication latch for the exact release commit. No gameplay, schema, namespace, command, persistence, or compatibility identifier changed during promotion.',
              1,
          )
          text = text.replace(
              '- The presentation pass changes no gameplay logic, configuration schema, migration behavior, network IDs, provenance data, command names, Java package, mod ID, or datapack namespace. The hands-on client/gameplay and separately installed multiplayer matrix, a real in-running-game datapack reload cycle, and representative third-party biome, hostile-mob, boss, inventory-mob, custom-shearable, tool, and machine checks remain open before promotion to `1.2.0`. With `release_ready=false`, this entry makes no release claim and creates no tag or publication.',
              '- The maintainer completed the hands-on block, entity, XP, explosion, provenance, shearing, GUI, multiplayer, restart, migration, reload, and high-output release checks against `1.2.0-rc.1`, and reported that all passed. Third-party compatibility remains case-specific and is not represented as a blanket guarantee. Stable `1.2.0` is rebuilt from the exact promoted source rather than produced by renaming the release-candidate JAR.',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = root / 'BUILD_STATUS.md'
          old = path.read_text(encoding='utf-8')
          current = [
              '# Build status',
              '',
              '## Resource Multiplier 1.2.0',
              '',
              'Resource Multiplier `1.2.0` is the stable Fabric release for Minecraft Java Edition 26.2. The maintainer confirmed that the manual `1.2.0-rc.1` release matrix passed on 2026-08-30.',
              '',
              '- Version: `1.2.0`',
              '- Publication latch: `release_ready=true`',
              '- Expected JAR: `build/libs/resource-multiplier-1.2.0.jar`',
              '- Mod ID and datapack namespace remain `smart_resource_drops`',
              '- Config path remains `config/smart_resource_drops.json`',
              '- Commands remain `/smartdrops` and `/smartdropsgui`',
              '',
              'The stable JAR is rebuilt from source. Renaming the release-candidate JAR is invalid because its embedded Fabric metadata, manifest, package records, and checksums would still identify `1.2.0-rc.1`.',
              '',
              'Finalization build: `__FINAL_JAR_SIZE__` bytes, `__FINAL_JAR_ENTRIES__` ZIP entries, SHA-256 `__FINAL_JAR_SHA__`.',
              '',
              'Third-party compatibility remains case-specific rather than a blanket guarantee.',
              '',
              '## Archived release-candidate evidence',
              '',
          ]
          path.write_text('\n'.join(current) + old.split('\n', 2)[2], encoding='utf-8')

          path = root / 'docs/PUBLIC_RELEASE_CHECKLIST.md'
          text = path.read_text(encoding='utf-8')
          text = text.replace('## 1.2.0-rc.1 release candidate', '## Resource Multiplier 1.2.0', 1)
          intro_start = text.index('This checklist applies to')
          intro_end = text.index('\n\n## Automated and artifact gates', intro_start)
          text = text[:intro_start] + 'The maintainer confirmed that the complete manual `1.2.0-rc.1` release matrix passed. This file records promotion to stable `1.2.0`.' + text[intro_end:]
          manual_start = text.index('## Manual gameplay and operations gates')
          third_party_start = text.index('## Named third-party compatibility gates')
          manual = text[manual_start:third_party_start].replace('- [ ]', '- [x]')
          text = text[:manual_start] + manual + text[third_party_start:]
          final_start = text.index('## Final promotion gate')
          archived = text.index('\n\nThe prior full checklist', final_start)
          final = '\n'.join([
              '## Final promotion gate',
              '',
              '- [x] Complete the manual gameplay and operations matrix.',
              '- [x] Record third-party compatibility as case-specific, without a blanket support claim.',
              '- [x] Change `mod_version` from `1.2.0-rc.1` to `1.2.0`.',
              '- [x] Set `release_ready=true` only in the fully tested release commit.',
              '- [x] Run the full Java 25 validation chain before pushing the release commit.',
              '- [ ] Confirm the exact final commit passes the clean-checkout Build and verify workflow.',
              '- [ ] Confirm tag `v1.2.0` and the guarded release workflow publish the final checksums and artifacts.',
          ])
          text = text[:final_start] + final + text[archived:]
          path.write_text(text, encoding='utf-8')

          path = root / 'docs/GITHUB_UPLOAD.md'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'The current tree is Resource Multiplier `1.2.0-rc.1`. It is a development release candidate with open manual gates, no published GitHub Release, and `release_ready=false`; do not label or tag it as final `1.2.0`.',
              'Resource Multiplier `1.2.0` is the stable Fabric 26.2 release line. The exact release commit uses `release_ready=true`; ordinary development commits must keep the latch disabled.',
              1,
          )
          release_start = text.index('## Release')
          settings_start = text.index('## Repository presentation and settings checklist')
          release_section = '\n'.join([
              '## Release',
              '',
              'The stable JAR must be rebuilt from source. Never rename `resource-multiplier-1.2.0-rc.1.jar` to `resource-multiplier-1.2.0.jar`, because renaming does not update embedded metadata or checksums.',
              '',
              'After the final `main` commit passes Build and verify, tag it as `v1.2.0`. The guarded release workflow verifies `release_ready=true`, main ancestry, and tag/version equality, then rebuilds, tests, packages, and publishes the release.',
              '',
              'After publication, set `release_ready=false` in the first commit of the next development cycle.',
              '',
          ])
          path.write_text(text[:release_start] + release_section + text[settings_start:], encoding='utf-8')

          for relative in [
              'CONTRIBUTING.md',
              'docs/COMMANDS.md',
              'docs/CONFIGURATION.md',
              'docs/COMPATIBILITY.md',
              'docs/ROADMAP.md',
              'docs/TESTING.md',
              '.github/ISSUE_TEMPLATE/bug_report.yml',
              '.github/ISSUE_TEMPLATE/mod_compatibility.yml',
          ]:
              path = root / relative
              path.write_text(path.read_text(encoding='utf-8').replace('1.2.0-rc.1', '1.2.0'), encoding='utf-8')

          path = root / 'docs/IMPLEMENTATION_LOG.md'
          text = path.read_text(encoding='utf-8')
          entry = '\n'.join([
              '## 2026-08-30, Resource Multiplier 1.2.0 stable promotion',
              '',
              'The maintainer completed the manual `1.2.0-rc.1` release matrix and reported that all checked behavior passed. The stable promotion changes release metadata and current-status documentation only. Gameplay logic, schema 3, the `smart_resource_drops` compatibility ID and namespace, Java packages, commands, configuration path, network identifiers, and saved provenance remain unchanged.',
              '',
              'The stable JAR is rebuilt from source instead of being renamed. The finalization and guarded release workflows rerun package validation, unit tests, dedicated-server GameTests, the Java 25 Loom build, and real client GUI/authority tests before publication.',
              '',
          ])
          path.write_text(text.replace('# Implementation log\n\n', '# Implementation log\n\n' + entry, 1), encoding='utf-8')

          release_note = root / 'docs/releases/1.2.0.md'
          release_note.parent.mkdir(parents=True, exist_ok=True)
          release_note.write_text('\n'.join([
              '# Resource Multiplier 1.2.0 release record',
              '',
              'Resource Multiplier `1.2.0` promotes the manually validated `1.2.0-rc.1` candidate without gameplay changes.',
              '',
              'The maintainer confirmed the supported block, entity death-loot, XP, shearing, GUI, multiplayer, persistence, migration, reload, command, and high-output checks passed.',
              '',
              'The mod ID and datapack namespace remain `smart_resource_drops`; the config path remains `config/smart_resource_drops.json`; commands remain `/smartdrops` and `/smartdropsgui`.',
              '',
              'The stable JAR is rebuilt as `resource-multiplier-1.2.0.jar`. Renaming the release-candidate JAR is not valid because embedded metadata and checksums would remain stale.',
              '',
              'Third-party compatibility remains case-specific and should be reported with exact project versions.',
              '',
          ]), encoding='utf-8')

          path = root / '.github/workflows/release.yml'
          text = path.read_text(encoding='utf-8')
          text = text.replace("on:\n  push:\n    tags: ['v*']\n", "on:\n  push:\n    tags: ['v*']\n  workflow_dispatch:\n", 1)
          path.write_text(text, encoding='utf-8')

          path = root / 'tools/validate_package.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('"mod_version": "1.2.0-rc.1",', '"mod_version": "1.2.0",', 1)
          text = text.replace('if properties.get("release_ready") != "false":\n    fail("The 1.2.0-rc.1 development candidate must keep release_ready=false")', 'if properties.get("release_ready") != "true":\n    fail("The stable 1.2.0 release commit must set release_ready=true")', 1)
          text = text.replace('"Status-1.2.0--rc.1",', '"Status-1.2.0-Release",', 1)
          text = text.replace('"There is no stable public download yet.",', '"Current stable release:",', 1)
          text = text.replace('"Resource Multiplier 1.2.0 is not publicly released yet.",', '"Official Resource Multiplier builds are published through",', 1)
          path.write_text(text, encoding='utf-8')

          assert 'mod_version=1.2.0\n' in (root / 'gradle.properties').read_text(encoding='utf-8')
          assert 'release_ready=true' in (root / 'gradle.properties').read_text(encoding='utf-8')
          assert 'resource-multiplier-1.2.0.jar' in (root / 'README.md').read_text(encoding='utf-8')
          PY

      - name: Validate, test, and build stable 1.2.0
        shell: bash
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build
          xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Record stable build identity
        shell: bash
        run: |
          jar_path='build/libs/resource-multiplier-1.2.0.jar'
          test -f "$jar_path"
          jar_size="$(stat -c '%s' "$jar_path")"
          jar_entries="$(unzip -Z1 "$jar_path" | wc -l | tr -d ' ')"
          jar_sha="$(sha256sum "$jar_path" | awk '{print toupper($1)}')"
          python3 - "$jar_size" "$jar_entries" "$jar_sha" <<'PY'
          from pathlib import Path
          import sys
          size, entries, sha = sys.argv[1:]
          path = Path('BUILD_STATUS.md')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace('__FINAL_JAR_SIZE__', size).replace('__FINAL_JAR_ENTRIES__', entries).replace('__FINAL_JAR_SHA__', sha), encoding='utf-8')
          PY
          python3 tools/validate_package.py

      - name: Commit, push, tag, and dispatch guarded release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm '.github/workflows/finalize-1.2.0.yml'
          git config user.name 'Resource Multiplier Release Automation'
          git config user.email '145610849+chedidandrew@users.noreply.github.com'
          git add -A
          git commit -m 'Release Resource Multiplier 1.2.0'
          final_sha="$(git rev-parse HEAD)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" HEAD:main
          git tag -a v1.2.0 -m 'Resource Multiplier 1.2.0' "$final_sha"
          git push "$remote" refs/tags/v1.2.0
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.2.0; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
