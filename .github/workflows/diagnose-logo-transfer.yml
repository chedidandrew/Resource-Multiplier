name: Diagnose Smart logo transfer

on:
  push:
    branches:
      - branding/smart-logo-final
    paths:
      - .github/workflows/diagnose-logo-transfer.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Hash staged chunks
        shell: bash
        run: |
          set -euo pipefail
          wc -c .branding-staging/icon.b64.part*
          sha256sum .branding-staging/icon.b64.part*
          cat .branding-staging/icon.b64.part* | tr -d '\n' | base64 --decode > /tmp/icon.png
          wc -c /tmp/icon.png
          sha256sum /tmp/icon.png
