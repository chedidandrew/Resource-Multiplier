name: Publish Resource Multiplier 1.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.2.1.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'chedidandrew/Resource-Multiplier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tested release commit
        shell: bash
        run: |
          target='34cc5a64c6d97c8db332ce45260c7615a8f9ab97'
          test "$(git rev-parse HEAD^)" = "$target" || {
            echo "Unexpected parent commit; refusing publication." >&2
            exit 1
          }
          test "$(git show "$target:gradle.properties" | sed -n 's/^mod_version=//p')" = '1.2.1'
          test "$(git show "$target:gradle.properties" | sed -n 's/^release_ready=//p')" = 'true'
          test -z "$(git tag -l v1.2.1)"

      - name: Create annotated stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Resource Multiplier Release Automation'
          git config user.email '145610849+chedidandrew@users.noreply.github.com'
          git tag -a v1.2.1 34cc5a64c6d97c8db332ce45260c7615a8f9ab97 -m 'Resource Multiplier 1.2.1'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin refs/tags/v1.2.1
