name: Prepare Smart Resource Multiplier 1.2.2 release

on:
  push:
    branches:
      - release/1.2.2-publish

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified stable-release promotion
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n' < .release-staging/release-1.2.2.patch.xz.b64 | base64 --decode | xz --decompress > /tmp/release-1.2.2.patch
          echo '81d85d8c90cde556a05a0de680d459708f1f9d35d1f4fcf9ae52e299a86e0c14  /tmp/release-1.2.2.patch' | sha256sum -c -
          git apply --check /tmp/release-1.2.2.patch
          git apply /tmp/release-1.2.2.patch
          rm -rf .release-staging
          rm .github/workflows/promote-1.2.2.yml
          git add -A
          git diff --cached --check

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle data
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate package metadata and policy logic
        run: |
          python3 tools/validate_package.py
          python3 scripts/test_release_packaging.py
          python3 scripts/test_modmenu_integration.py
          python3 scripts/test_structured_tooltip_composition.py
          python3 scripts/edge_case_source_audit.py
          python3 scripts/polish_regression_tests.py
          bash tools/run_core_tests.sh

      - name: Run Java and dedicated-server tests, then build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test runGameTest build

      - name: Run client GUI and authority tests
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Validate deterministic release packaging
        run: |
          rm -rf /tmp/srm-dist
          python3 tools/package_release.py --output-dir /tmp/srm-dist

      - name: Commit verified release promotion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Promote Smart Resource Multiplier 1.2.2 release'
          git push origin HEAD:release/1.2.2-publish
